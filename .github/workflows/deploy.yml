name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages, and to authenticate against it.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A run already under way is left to finish, so a
# half-uploaded artifact never becomes the live site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test browser language redirection, newsletter and changelog
        run: node --experimental-strip-types --test test/browser_locale_redirect.test.ts test/newsletter.test.ts test/changelog.test.ts
      - name: Generate the static site
        run: pnpm generate
        env:
          NUXT_PUBLIC_LOOPS_FORM_ID: ${{ secrets.LOOPS_FORM_ID }}
      - name: Test generated site hydration
        run: pnpm test:hydration
      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .output/public
  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
